[project]
name = "package-code-receiving"
version = "1.3.0"
description = "FastAPI backend that verifies scanned GTIN-14 package codes for pharmaceutical goods receipt, reconciles receipts against purchase orders with idempotent scan batches and assesses cold-chain temperature records"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
