services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: package-code-api:latest
    environment:
      # Inside the container uvicorn always listens on 8000; only the
      # published host port is overridable through API_PORT.
      API_PORT: "8000"
    ports:
      # API_PORT defaults to 8000 on the host; override it with
      # `API_PORT=9000 docker compose up -d --build`.
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # One-shot acceptance service: builds the same image, waits for the API
  # to become healthy, runs the end-to-end acceptance script (stdlib only)
  # and exits 0/1. It does not publish ports or restart.
  #
  # Run it with:
  #   docker compose run --rm verify
  verify:
    image: package-code-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/acceptance.py"]
    environment:
      API_BASE: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    profiles:
      - verify
